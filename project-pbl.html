<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PBL 项目制学习平台</title>
  <style>
    :root {
      --bg: #fafafa;
      --text: #1a1a1a;
      --text-secondary: #666;
      --accent: #2563eb;
      --card-bg: #ffffff;
      --border: #e5e5e5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
    }

    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-link:hover { color: var(--accent); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .project-info {
      text-align: center;
      max-width: 500px;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
    }

    p {
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-link">← 返回作品集</a>
  </header>

  <main>
    <div class="project-info">
      <div class="icon">🎓</div>
      <h1>PBL 项目制学习平台</h1>
      <p>面向研究生群体的 AI 辅助 PBL 教学平台，支持教学方案生成、过程追踪、任务管理与个性化能力报告。</p>
      <a href="/pbl-platform/index.html" target="_blank" class="btn">查看原型 →</a>
    </div>
  </main>
</body>
</html>
